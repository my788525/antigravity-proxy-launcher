name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build AntigravityLauncher
        shell: cmd
        run: |
          build.bat

      - name: Create Release Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -match 'refs/tags/(.*)') { $matches[1] } else { 'v1.0.0' }
          $zipName = "AntigravityLauncher-$tag-windows-x64.zip"
          Compress-Archive -Path dist\* -DestinationPath $zipName -Force
          Write-Output "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
